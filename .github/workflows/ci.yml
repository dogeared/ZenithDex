name: CI

# Build on every push; publish the image and deploy to the NAS only from main.
# See dogeared/dogeared-central-infra MOVE-TO-MAC.md (Part F) and deploy/README.md.

on:
  push:
    branches:
      - "**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Runs the backend, Spring, and Vaadin browserless frontend tests.
      # JaCoCo fails the build if overall line coverage drops below 90%.
      # The Vaadin production frontend build happens in the Dockerfile.
      - name: Build and test
        run: mvn -B verify

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco

  # Only a merge to main publishes. Branch pushes run the build but can never
  # produce a :latest image, so branch code can never reach the NAS.
  publish:
    name: Publish image
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Determine version
        id: version
        run: |
          set -euo pipefail
          VERSION=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          VERSION=${VERSION%-SNAPSHOT}
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/dogeared/zenithdex
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=sha-
            type=raw,value=${{ steps.version.outputs.value }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The only deploy path: the agent on the NAS is reachable only through its
  # Cloudflare tunnel and authorises each call with an HMAC over
  # "<timestamp>.<body>". Missing secrets are a setup error, so fail loudly
  # rather than leave the NAS on the previous image.
  deploy:
    name: Deploy to NAS
    runs-on: ubuntu-latest
    needs: publish
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Ask the NAS to deploy
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
          PROJECT: zenithdex
        run: |
          if [ -z "$DEPLOY_WEBHOOK_URL" ] || [ -z "$DEPLOY_WEBHOOK_SECRET" ]; then
            echo "::error::DEPLOY_WEBHOOK_URL / DEPLOY_WEBHOOK_SECRET are not set"
            exit 1
          fi
          BODY=$(printf '{"project":"%s","sha":"%s"}' "$PROJECT" "$GITHUB_SHA")
          TS=$(date +%s)
          SIG=$(python3 -c 'import hashlib,hmac,sys; print(hmac.new(sys.argv[1].encode(), sys.argv[2].encode()+b"."+sys.argv[3].encode(), hashlib.sha256).hexdigest())' "$DEPLOY_WEBHOOK_SECRET" "$TS" "$BODY")
          for attempt in 1 2 3; do
            code=$(curl -sS -o /tmp/deploy.json -w '%{http_code}' -X POST "$DEPLOY_WEBHOOK_URL" \
              -H 'Content-Type: application/json' \
              -H "X-Deploy-Timestamp: $TS" \
              -H "X-Deploy-Signature: sha256=$SIG" \
              --data "$BODY" || echo 000)
            if [ "$code" = "200" ]; then
              cat /tmp/deploy.json
              exit 0
            fi
            echo "attempt $attempt failed (HTTP $code)"
            cat /tmp/deploy.json 2>/dev/null || true
            sleep 10
          done
          exit 1
